<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reckon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1a26'/%3E%3Cpath d='M9 23V9h7a4 4 0 010 8H9l9 6' fill='none' stroke='%2319a2b8' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<script>
/* applied before first paint so a pinned theme does not flash */
try { var t = localStorage.getItem('reckon.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>

<header>
  <div class="brand">
    <h1>reck<i>o</i>n</h1>
    <span class="sub" id="machine-sub">reading…</span>
  </div>
  <nav id="tabs" role="tablist" aria-label="Sections">
    <button role="tab" id="tabbtn-overview" aria-controls="tab-overview" data-tab="overview" aria-selected="true" tabindex="0">Overview<span class="count" id="count-overview"></span></button>
    <button role="tab" id="tabbtn-memory" aria-controls="tab-memory" data-tab="memory" aria-selected="false" tabindex="-1">Memory</button>
    <button role="tab" id="tabbtn-pressure" aria-controls="tab-pressure" data-tab="pressure" aria-selected="false" tabindex="-1">Pressure<span class="count" id="count-pressure"></span></button>
    <button role="tab" id="tabbtn-disk" aria-controls="tab-disk" data-tab="disk" aria-selected="false" tabindex="-1">Disk</button>
    <button role="tab" id="tabbtn-internet" aria-controls="tab-internet" data-tab="internet" aria-selected="false" tabindex="-1">Internet<span class="count" id="count-internet"></span></button>
    <button role="tab" id="tabbtn-checks" aria-controls="tab-checks" data-tab="checks" aria-selected="false" tabindex="-1">Checks<span class="count" id="count-checks"></span></button>
    <span class="spacer"></span>
    <button role="tab" id="tabbtn-dns" aria-controls="tab-dns" data-tab="dns" aria-selected="false" tabindex="-1" class="risky">DNS</button>
  </nav>
</header>

<main>
  <section id="tab-overview" role="tabpanel" aria-labelledby="tabbtn-overview"></section>
  <section id="tab-memory" role="tabpanel" aria-labelledby="tabbtn-memory" hidden></section>
  <section id="tab-pressure" role="tabpanel" aria-labelledby="tabbtn-pressure" hidden></section>
  <section id="tab-disk" role="tabpanel" aria-labelledby="tabbtn-disk" hidden></section>
  <section id="tab-internet" role="tabpanel" aria-labelledby="tabbtn-internet" hidden></section>
  <section id="tab-checks" role="tabpanel" aria-labelledby="tabbtn-checks" hidden></section>
  <section id="tab-dns" role="tabpanel" aria-labelledby="tabbtn-dns" hidden></section>
</main>

<footer>
  <span>this panel: <b class="self" id="self-rss">—</b> of RAM <span id="self-share"></span></span>
  <span>cpu <b id="self-cpu">—</b></span>
  <span id="self-policy">collects on demand · no polling</span>
  <span class="balance" id="balance"></span>
  <a href="/pet" class="footlink">pet preview</a>
  <button type="button" id="theme" class="footbtn" aria-label="Colour theme">theme: auto</button>
</footer>

<script src="/charts.js"></script>
<script src="/app.js"></script>
</body>
</html>
