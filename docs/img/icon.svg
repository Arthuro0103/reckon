<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><defs></defs><style></style><rect width="256" height="256" rx="48" fill="#071520"/><svg x="28" y="28" xmlns="http://www.w3.org/2000/svg" class="pet-root" style="--sway:1.3deg;--swingT:3.64s;--flickT:1.34s;--pulseT:2.65s;--shake:0.50px;--shakeT:0.140s" viewBox="0 0 120 120" width="200" height="200" role="img" aria-label="reckon, watching"><style>
.pet-root { overflow: visible }
.pet-pop, .pet-swing, .pet-shake, .pet-flame, .pet-eyes, .pet-halo, .pet-drop, .pet-ray-l, .pet-ray-r
  { transform-box: view-box }
.pet-pop   { transform-origin: 60px 66px }
.pet-swing { transform-origin: 60px 13px; animation: pet-sway 3.64s ease-in-out infinite }
.pet-flame { transform-origin: 60px 62px; animation: pet-flicker 1.34s ease-in-out infinite alternate }
.pet-halo  { transform-origin: 60px 66px; animation: pet-breathe-glow 2.65s ease-in-out infinite }
.pet-eyes  { transform-origin: 60px 80px; animation: pet-blink 4.6s ease-in-out infinite }
.pet-ray-l { animation: pet-ray-l 2.65s ease-out infinite }
.pet-ray-r { animation: pet-ray-r 2.65s ease-out infinite }
.pet-drop  { animation: pet-fall 1.5s ease-in infinite }
.pet-drop2 { animation-delay: 0.75s }
.pet-asleep .pet-swing { transform-origin: 60px 110px; animation: pet-breathe 3.8s ease-in-out infinite }
.pet-asleep .pet-eyes { animation: none }
.pet-strain .pet-shake { animation: pet-shake 0.140s steps(1, end) infinite }
.pet-strain .pet-eyes { animation: none }
.pet-wake .pet-pop { animation: pet-wake 0.6s cubic-bezier(0.3, 1.5, 0.5, 1) }
@keyframes pet-sway { 0%, 100% { transform: rotate(calc(1.3deg * -1)) } 50% { transform: rotate(1.3deg) } }
@keyframes pet-breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.025, 1.015) } }
@keyframes pet-flicker {
  0% { transform: scale(1, 1) skewX(0deg) }
  50% { transform: scale(0.9, 1.14) skewX(5deg) }
  100% { transform: scale(1.07, 0.9) skewX(-5deg) }
}
@keyframes pet-breathe-glow { 0%, 100% { opacity: 0.7; transform: scale(0.96) } 50% { opacity: 1; transform: scale(1.05) } }
@keyframes pet-blink { 0%, 90%, 100% { transform: scaleY(1) } 94% { transform: scaleY(0.08) } }
@keyframes pet-ray-l { 0% { transform: translateX(0); opacity: 1 } 100% { transform: translateX(-5px); opacity: 0.25 } }
@keyframes pet-ray-r { 0% { transform: translateX(0); opacity: 1 } 100% { transform: translateX(5px); opacity: 0.25 } }
@keyframes pet-fall { 0% { transform: translateY(0); opacity: 0 } 20% { opacity: 1 } 100% { transform: translateY(24px); opacity: 0 } }
@keyframes pet-shake { 0% { transform: translate(0.50px, 0) } 50% { transform: translate(calc(0.50px * -1), calc(0.50px * 0.4)) } }
@keyframes pet-wake { 0% { transform: scale(0.82); opacity: 0.4 } 100% { transform: scale(1); opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .pet-root * { animation: none !important } }
</style><defs><radialGradient id="halo-watching-watching" cx="60" cy="66" r="52" gradientUnits="userSpaceOnUse"><stop offset="0.35" stop-color="#3ddbf0" stop-opacity="0.20"/><stop offset="1" stop-color="#3ddbf0" stop-opacity="0"/></radialGradient><radialGradient id="glass-watching-watching" cx="60" cy="66" r="34" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3ddbf0" stop-opacity="0.56"/><stop offset="1" stop-color="#3ddbf0" stop-opacity="0.06"/></radialGradient></defs><g class="pet-pop"><circle class="pet-halo" cx="60" cy="66" r="52" fill="url(#halo-watching-watching)"/><g class="pet-swing"><g class="pet-shake"><g class="pet-ray-l"><path d="M24 54 L15.6 51" fill="none" stroke="#3ddbf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 64 L15.6 61" fill="none" stroke="#3ddbf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g class="pet-ray-r"><path d="M96 54 L104.4 51" fill="none" stroke="#3ddbf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 64 L104.4 61" fill="none" stroke="#3ddbf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M38 46 Q31 76 37 106 H83 Q89 76 82 46 Z" fill="#0b1a26"/><path d="M38 46 Q31 76 37 106 H83 Q89 76 82 46 Z" fill="url(#glass-watching-watching)"/><path d="M38 46 Q31 76 37 106 H83 Q89 76 82 46 Z" fill="none" stroke="#3ddbf0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g class="pet-flame"><path d="M60 54 Q64.4 59.2 60 62 Q55.6 59.2 60 54Z" fill="#3ddbf0" stroke="#3ddbf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/></g><path d="M34 46 L46 32 H74 L86 46 Z" fill="none" stroke="#3ddbf0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="20" r="7" fill="none" stroke="#3ddbf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 27 V32" fill="none" stroke="#3ddbf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 110 H90" fill="none" stroke="#3ddbf0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g class="pet-eyes"><ellipse cx="50" cy="80" rx="7" ry="9" fill="none" stroke="#3ddbf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="81" r="3" fill="#3ddbf0"/><ellipse cx="70" cy="80" rx="7" ry="9" fill="none" stroke="#3ddbf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="81" r="3" fill="#3ddbf0"/></g><path d="M53 100 Q60 104.4 67 100" fill="none" stroke="#3ddbf0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></svg></svg>