<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><defs></defs><style>.st{font:800 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.5px}.sd{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9db3c1}.mono2{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect width="900" height="260" fill="#071520"/><path d="M30,40 L200,40 L226,70 L200,100 L30,100 L56,70 Z" fill="#0b1a26" stroke="#24455a" stroke-width="2"/><text x="128" y="76" text-anchor="middle" class="st" fill="#e4f0f5">READS</text><text x="128" y="128" text-anchor="middle" class="sd">your machine, read-only</text><path d="M245,40 L415,40 L441,70 L415,100 L245,100 L271,70 Z" fill="#0b1a26" stroke="#24455a" stroke-width="2"/><text x="343" y="76" text-anchor="middle" class="st" fill="#e4f0f5">JUDGES</text><text x="343" y="128" text-anchor="middle" class="sd">every item: what it frees,</text><text x="343" y="146" text-anchor="middle" class="sd">the proof, what you lose if</text><text x="343" y="164" text-anchor="middle" class="sd">wrong</text><path d="M460,40 L630,40 L656,70 L630,100 L460,100 L486,70 Z" fill="#0b1a26" stroke="#24455a" stroke-width="2"/><text x="558" y="76" text-anchor="middle" class="st" fill="#e4f0f5">HANDS YOU</text><text x="558" y="128" text-anchor="middle" class="sd">the command</text><path d="M675,40 L845,40 L871,70 L845,100 L675,100 L701,70 Z" fill="#0b1a26" stroke="#3ddbf0" stroke-width="2"/><text x="773" y="76" text-anchor="middle" class="st" fill="#3ddbf0">YOU RUN IT</text><text x="773" y="128" text-anchor="middle" class="sd">reckon stops here</text><g transform="translate(30,196)"><text x="0" y="14" class="mono2" fill="#9db3c1">verdicts</text><rect x="100" y="-2" width="106" height="26" rx="13" fill="none" stroke="#3ddbf0"/><text x="153.0" y="16" text-anchor="middle" class="mono2" fill="#3ddbf0">disposable</text><rect x="250" y="-2" width="66" height="26" rx="13" fill="none" stroke="#9db3c1"/><text x="283.0" y="16" text-anchor="middle" class="mono2" fill="#9db3c1">yours</text><rect x="400" y="-2" width="122" height="26" rx="13" fill="none" stroke="#cc6f28"/><text x="461.0" y="16" text-anchor="middle" class="mono2" fill="#cc6f28">cannot judge</text><text x="840" y="14" text-anchor="end" class="mono2" fill="#9db3c1">writes only inside ~/.cache/reckon/</text></g></svg>